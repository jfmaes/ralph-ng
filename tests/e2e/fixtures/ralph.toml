[ralph]
branch_prefix = "ralph/"
auto_push = false
max_retries_per_task = 3
max_ratchet_checks_per_task = 10

[models]
executor = "sonnet"
evaluator = "opus"
cli = "claude"

[timeouts]
executor_call_seconds = 30
verification_command_seconds = 5
evaluator_call_seconds = 30

[git]
protected_branches = ["main", "master"]
force_push = false
